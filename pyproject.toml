[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tdfextractor"
dynamic = ["version"]
description = "Extract MS2, MGF, and mzML files from Bruker timsTOF .d folders"
authors = [
    {name = "Patrick Garrett", email = "pgarrett@scripps.edu"},
]
dependencies = [
    "tdfpy>=1.0.2",
    "serenipy>=0.4.0",
    "psims>=1.3.6",
    "numpy",
    "pandas",
    "tqdm",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Intended Audience :: Science/Research",
    "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.12"
license = {file = "LICENSE"}
keywords = ["bruker", "timstof", "mass-spectrometry", "proteomics", "tdf", "ms2", "mgf", "mzml", "pasef"]

[project.urls]
Repository = "https://github.com/pgarrett-scripps/tdfextractor"
"Bug Tracker" = "https://github.com/pgarrett-scripps/tdfextractor/issues"

[project.optional-dependencies]
# Optional compression backends for the mzML extractor. numpress-* compression
# modes need pynumpress; zstd needs pyzstd.
compression = [
    "pynumpress>=0.0.9",
    "pyzstd>=0.16",
]

[project.scripts]
mgf-extractor = "tdfextractor.mgf_exctractor:main"
ms2-extractor = "tdfextractor.ms2_extractor:main"
mzml-extractor = "tdfextractor.mzml_extractor:main"
mgf-ex = "tdfextractor.mgf_exctractor:main"
ms2-ex = "tdfextractor.ms2_extractor:main"
mzml-ex = "tdfextractor.mzml_extractor:main"

[tool.hatch.version]
path = "src/tdfextractor/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/tdfextractor"]

[tool.hatch.build.targets.sdist]
include = [
    "src/tdfextractor",
    "tests",
    "README.md",
    "LICENSE",
    "CHANGLOG.md",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "ty>=0.0.9",
    "ruff>=0.14.3",
    "pyupgrade>=3.21.0",
    "pynumpress>=0.0.9",
    "pyzstd>=0.16",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ty.rules]
# psims does not ship a PEP 561 marker, so every `from psims.mzml.writer
# import ...` would otherwise fail the checker. Ignore resolution errors
# rather than vendoring stubs.
unresolved-import = "ignore"

[tool.ty.src]
# Legacy modules that predate the modernization pass and still have type
# issues against the current tdfpy / serenipy typings. They should be
# cleaned up in a follow-up typing pass rather than rewritten wholesale
# here.
exclude = [
    "src/tdfextractor/mgf_exctractor.py",
    "src/tdfextractor/ms2_extractor.py",
    "src/tdfextractor/utils.py",
]

# During development we resolve the three unreleased sibling projects from
# their GitHub repositories instead of PyPI. Published metadata still points
# at the PyPI names above, so this only affects `uv sync` / `uv lock`.
[tool.uv.sources]
tdfpy = {git = "https://github.com/tacular-omics/tdfpy", branch = "main"}
serenipy = {git = "https://github.com/pgarrett-scripps/serenipy", branch = "main"}
psims = {git = "https://github.com/pgarrett-scripps/psims", branch = "master"}
